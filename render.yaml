services:
  - type: web
    name: el-mejor-bot
    runtime: node
    plan: free
    buildCommand: "npm install --no-audit --no-fund --prefer-offline && python3 -m venv .venv && .venv/bin/python -m pip install --disable-pip-version-check -U \"yt-dlp[default,curl-ffi]\" && npx puppeteer browsers install chrome"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "3000"
      - key: GITHUB_REPO
        value: alpizar269708-crypto/el-mejor-bot
      - key: SESSION_BRANCH
        value: session-data
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
