services:
  - type: web
    name: el-mejor-bot
    runtime: node
    plan: free
    buildCommand: "YOUTUBE_DL_HOST=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux npm install --no-audit --no-fund && python3 -m venv .venv-gallery-dl && .venv-gallery-dl/bin/python -m pip install --disable-pip-version-check --no-cache-dir gallery-dl==1.32.16"
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000

  - type: cron
    name: el-mejor-bot-keepalive
    runtime: node
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "YOUTUBE_DL_HOST=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux npm install --no-audit --no-fund"
    startCommand: curl -fsS --max-time 25 --retry 2 --retry-delay 3 https://el-mejor-bot-tmw5.onrender.com/keepalive
