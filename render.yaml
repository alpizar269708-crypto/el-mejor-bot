services:
  - type: web
    name: el-mejor-bot
    runtime: node
    plan: free
    buildCommand: "YOUTUBE_DL_HOST=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux npm install --no-audit --no-fund"
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000

  - type: cron
    name: el-mejor-bot-keepalive
    runtime: node
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "YOUTUBE_DL_HOST=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux npm install --no-audit --no-fund"
    startCommand: curl -fsS https://el-mejor-bot.onrender.com/keepalive
