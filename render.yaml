services:
  - type: web
    name: el-mejor-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000

  - type: cron
    name: el-mejor-bot-keepalive
    runtime: node
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: npm install
    startCommand: curl -fsS https://el-mejor-bot.onrender.com/keepalive
