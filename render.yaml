services:
  - type: web
    name: el-mejor-bot
    runtime: node
    plan: free
    buildCommand: "YOUTUBE_DL_HOST=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux npm install --no-audit --no-fund --prefer-offline && python3 -m venv .venv-gallery-dl && .venv-gallery-dl/bin/python -m pip install --disable-pip-version-check gallery-dl==1.32.16"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "3000"
      - key: GITHUB_REPO
        value: alpizar269708-crypto/el-mejor-bot
      - key: SESSION_BRANCH
        value: session-data
      - key: MEMORY_BRANCH
        value: memory-data
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
