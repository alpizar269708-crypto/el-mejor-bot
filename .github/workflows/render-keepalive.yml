name: Keep Render bot awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render keepalive endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::Configura el secreto RENDER_URL con la URL pública de tu servicio Render."
            exit 0
          fi
          BASE_URL="${RENDER_URL%/}"
          curl --fail --silent --show-error --max-time 20 --retry 2 "$BASE_URL/keepalive"
