name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        # Tests validate source logic; skip third-party postinstall downloads that
        # depend on GitHub API rate limits (runtime deployment installs normally).
        run: npm install --no-audit --no-fund --prefer-offline --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
